<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Оценете вашето изживяване</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 13px; letter-spacing: 3px; color: #555; text-transform: uppercase; margin-bottom: 2.5rem; }
    h1 { font-size: 24px; font-weight: 600; color: #fff; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #555; margin-bottom: 3rem; }
    .stars { display: flex; justify-content: center; gap: 12px; margin-bottom: 1rem; }
    .star {
      font-size: 42px;
      cursor: pointer;
      transition: transform 0.1s ease, color 0.1s ease;
      color: #333;
      user-select: none;
    }
    .star.lit { color: #f5c518; transform: scale(1.1); }
    .star.selected { color: #f5c518; transform: scale(1.15); }
    .rating-label { font-size: 14px; color: #555; height: 20px; margin-bottom: 2.5rem; transition: color 0.2s; }
    .submit-btn {
      background: #fff; color: #000; border: none; border-radius: 50px;
      padding: 14px 40px; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s; opacity: 0.3; pointer-events: none;
    }
    .submit-btn.enabled { opacity: 1; pointer-events: all; }
    .submit-btn:hover { opacity: 0.85; }
    .success { display: none; }
    .success h2 { font-size: 22px; color: #fff; margin-bottom: 10px; }
    .success p { font-size: 14px; color: #555; margin-bottom: 2rem; }
    .book-btn {
      display: inline-block; background: transparent; color: #fff;
      border: 1px solid #333; border-radius: 50px; padding: 12px 32px;
      font-size: 14px; text-decoration: none; transition: border-color 0.2s;
    }
    .book-btn:hover { border-color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Клиника</div>
    <div id="rating-section">
      <h1>Как беше вашето изживяване?</h1>
      <p class="subtitle">Вашето мнение ни помага да се подобряваме</p>
      <div class="stars" id="stars">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>
      <div class="rating-label" id="rating-label"></div>
      <button class="submit-btn" id="submit-btn" onclick="submitRating()">Изпратете оценката</button>
    </div>
    <div class="success" id="success-section">
      <h2>Благодарим ви! ✨</h2>
      <p>Вашата оценка беше получена. Радваме се, че се доверихте на нашата клиника.</p>
      <a class="book-btn" href="https://dt2010v1.github.io/clinic-form/intake_form.html">Запазете нов час</a>
    </div>
  </div>
  <script>
    const labels = { 1: "Лошо", 2: "Задоволително", 3: "Добро", 4: "Много добро", 5: "Отлично ✨" };
    let selectedRating = 0;
    const stars = document.querySelectorAll('.star');
    const params = new URLSearchParams(window.location.search);
    const preRating = parseInt(params.get('rating'));
    const patientName = params.get('name') || '';
    const treatment = params.get('treatment') || '';

    stars.forEach(star => {
      star.addEventListener('mouseover', () => {
        const val = parseInt(star.dataset.value);
        stars.forEach(s => {
          parseInt(s.dataset.value) <= val ? s.classList.add('lit') : s.classList.remove('lit');
        });
        document.getElementById('rating-label').textContent = labels[val];
        document.getElementById('rating-label').style.color = '#aaa';
      });
      star.addEventListener('click', () => {
        selectedRating = parseInt(star.dataset.value);
        stars.forEach(s => {
          parseInt(s.dataset.value) <= selectedRating ? s.classList.add('selected') : s.classList.remove('selected');
        });
        document.getElementById('submit-btn').classList.add('enabled');
      });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
      stars.forEach(s => {
        s.classList.remove('lit');
        parseInt(s.dataset.value) <= selectedRating ? s.classList.add('selected') : s.classList.remove('selected');
      });
      document.getElementById('rating-label').textContent = selectedRating ? labels[selectedRating] : '';
      document.getElementById('rating-label').style.color = selectedRating ? '#aaa' : '#555';
    });

    if (preRating >= 1 && preRating <= 5) {
      setTimeout(() => {
        selectedRating = preRating;
        stars.forEach(s => { if (parseInt(s.dataset.value) <= preRating) s.classList.add('selected'); });
        document.getElementById('rating-label').textContent = labels[preRating];
        document.getElementById('rating-label').style.color = '#aaa';
        document.getElementById('submit-btn').classList.add('enabled');
      }, 300);
    }

    async function submitRating() {
      try {
        await fetch('https://demo192.app.n8n.cloud/webhook/05c63845-6d70-490d-b060-909a45a4b637', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rating: selectedRating, name: patientName, treatment: treatment })
        });
      } catch(e) { console.error(e); }
      document.getElementById('rating-section').style.display = 'none';
      document.getElementById('success-section').style.display = 'block';
    }
  </script>
</body>
</html>
